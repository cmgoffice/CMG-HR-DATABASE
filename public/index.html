<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
    <!-- นำเข้าฟอนต์ภาษาไทยพรีเมียม IBM Plex Sans Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // 🎨 ตั้งค่าสวมทับโทนสีและฟอนต์สำหรับระบบ HR Database โดยไม่ต้องแก้โค้ด React เลย!
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"IBM Plex Sans Thai"', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            },
            colors: {
              slate: {
                950: '#051416', // สีพื้นหลังส่วนหัวเข้มระดับพรีเมียม
                900: '#082224', // เปลี่ยนสีแถบเมนูด้านข้างจากสีเทาเข้มเดิม -> เป็นเขียวเข้มหรูหรา (Deep Teal Black)
                800: '#0c3538', // สี Hover สำหรับปุ่มในเมนู
                700: '#134e52', // สีเส้นแบ่งบอร์ดเดอร์ข้างใน
              },
              blue: {
                500: '#0E5E56', // เปลี่ยนโทนปุ่ม/ลิงก์แบรนด์น้ำเงินเดิม -> เป็นเขียวมรกตพรีเมียม (Slate-Teal)
                600: '#1E6B54', // โทนเขียวมรกตสว่างสำหรับแอคทีฟ
              },
              indigo: {
                500: '#0E5E56',
                600: '#1E6B54',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* สไตล์และฟอนต์ภาษาไทย */
      body {
        font-family: 'IBM Plex Sans Thai', sans-serif;
      }
      html {
        font-size: 85%;
      }
      /* Hide spin buttons in number inputs */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
